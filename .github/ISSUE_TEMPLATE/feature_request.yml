name: "Feature Request"
description: "Palette tweaks, wallpapers, or app support"
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for Synctax? Let me know what you'd like to see.

  - type: textarea
    id: problem
    attributes:
      label: What you want
      description: Describe the improvement or addition.
      placeholder: "I'd like a wallpaper / app theme support for..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Details
      description: Anything specific about how it should work.
    validations:
      required: true