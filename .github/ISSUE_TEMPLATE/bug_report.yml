name: "Bug Report"
description: "Report a color, wallpaper, or theming issue"
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for flagging something. Check existing issues first if you can.

  - type: textarea
    id: description
    attributes:
      label: What's wrong
      description: What isn't working as expected?
      placeholder: "In Kitty / GTK / Alacritty, text contrast is too low when..."
    validations:
      required: true

  - type: textarea
    id: affected_app
    attributes:
      label: Where it's broken
      description: Which app or component shows the issue?
      placeholder: "Hyprland borders / Kitty terminal / GTK dialog"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What color or contrast did you want?
    validations:
      required: true

  - type: textarea
    id: system_info
    attributes:
      label: Environment
      description: Output of `hyprctl version` and your Omarchy version.
      render: shell
      placeholder: |
        Omarchy: 4.x
        Hyprland: 0.44.0
    validations:
      required: true