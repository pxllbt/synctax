name: "🐛 Bug Report"
description: "Report a color contrast, wallpaper, or theming issue with Synctax"
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please check existing issues before submitting.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the theming issue is.
      placeholder: "In Kitty / GTK / Alacritty, text contrast is low when..."
    validations:
      required: true

  - type: textarea
    id: affected_app
    attributes:
      label: Affected Application
      description: Which application or component displays the issue? (e.g. Hyprland border, Better Bar, Ghostty, Neovim, GTK4)
      placeholder: "Hyprland borders / Kitty terminal / GTK dialog"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What color or contrast level did you expect?
    validations:
      required: true

  - type: textarea
    id: system_info
    attributes:
      label: Environment
      description: Output of `hyprctl version` and Omarchy version.
      render: shell
      placeholder: |
        Omarchy: 4.x
        Hyprland: 0.44.0
    validations:
      required: true
